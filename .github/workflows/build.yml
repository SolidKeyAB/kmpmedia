name: Build KMP Library

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # macOS is required: the iOS targets (iosArm64 / iosSimulatorArm64) are always
    # configured, and their compile/link tasks need Xcode.
    runs-on: macos-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Multiplatform Library
        run: ./gradlew build

      - name: ✅ Run Tests
        run: ./gradlew allTests

      - name: 📋 Regenerate OG_MANIFEST.md
        run: ./gradlew generateOgManifest --no-configuration-cache

      - name: 📝 Commit updated manifest (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/OG_MANIFEST.md library/src/commonMain/resources/OG_MANIFEST.md
          git diff --cached --quiet || git commit -m "chore(docs): auto-update OG_MANIFEST.md [skip ci]" && git push
