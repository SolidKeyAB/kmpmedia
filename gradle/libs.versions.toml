[versions]
agp = "8.7.2"
kotlin = "2.1.20"
jetpackCompose = "2.1.0"
coroutines = "1.9.0"
kermit = "2.0.4"

ktor = "2.3.5"
serialization = "1.8.0" # ✅ Latest stable version for Kotlin 2.1.0

uiUnitAndroid = "1.7.7"
coreKtx = "1.12.0"
