<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160" role="img" aria-label="KMPMedia">
  <!-- Lasso = a REGULAR hexagon: center (48,48), radius 29, pointy-top (mark coords). -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="0.55" stop-color="#4D8DF0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3346"/>
      <stop offset="1" stop-color="#171C28"/>
    </linearGradient>
    <linearGradient id="wordGrad" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="430" y2="0">
      <stop offset="0" stop-color="#9A86FF"/>
      <stop offset="1" stop-color="#38E0F0"/>
    </linearGradient>
    <clipPath id="lasso">
      <path d="M48 19 L73.11 33.5 L73.11 62.5 L48 77 L22.89 62.5 L22.89 33.5 Z"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="580" height="160" rx="28" fill="#0B0E16"/>
  <!-- mark -->
  <g transform="translate(24,32)">
    <rect x="6" y="6" width="84" height="84" rx="22" fill="#0E1220"/>
    <rect x="6.75" y="6.75" width="82.5" height="82.5" rx="21.25" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/>
    <rect x="16" y="16" width="64" height="64" rx="12" fill="url(#grad)" opacity="0.16"/>
    <g clip-path="url(#lasso)">
      <rect x="12" y="12" width="72" height="72" fill="url(#grad)"/>
      <path d="M42 40 L60 48 L42 56 Z" fill="#FFFFFF" opacity="0.92"/>
    </g>
    <path d="M48 19 L73.11 33.5 L73.11 62.5 L48 77 L22.89 62.5 L22.89 33.5 Z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
    <g fill="#FF7A59" stroke="#0E1220" stroke-width="1.2">
      <circle cx="48" cy="19" r="3.1"/>
      <circle cx="73.11" cy="33.5" r="3.1"/>
      <circle cx="73.11" cy="62.5" r="3.1"/>
      <circle cx="48" cy="77" r="3.1"/>
      <circle cx="22.89" cy="62.5" r="3.1"/>
      <circle cx="22.89" cy="33.5" r="3.1"/>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="150" y="88" font-size="54" font-weight="800" letter-spacing="-1.5">
      <tspan fill="url(#wordGrad)">KMP</tspan><tspan fill="#EAF0F8">Media</tspan>
    </text>
    <text x="152" y="120" font-size="17.5" font-weight="500" fill="#8B95A7" letter-spacing="0.2">Media for Kotlin Multiplatform &#183; Compose</text>
  </g>
</svg>
