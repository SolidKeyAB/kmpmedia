<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="KMPMedia social preview">
  <!-- Lasso = a REGULAR hexagon: center (48,48), radius 29, pointy-top (mark coords, scaled 2.6x). -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="0.55" stop-color="#4D8DF0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3346"/>
      <stop offset="1" stop-color="#171C28"/>
    </linearGradient>
    <linearGradient id="wordGrad" gradientUnits="userSpaceOnUse" x1="432" y1="0" x2="980" y2="0">
      <stop offset="0" stop-color="#9A86FF"/>
      <stop offset="1" stop-color="#38E0F0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.19" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#6D5EF6" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0B0E16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0B0E16" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lasso">
      <path d="M48 19 L73.11 33.5 L73.11 62.5 L48 77 L22.89 62.5 L22.89 33.5 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="#0B0E16"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#glow2)"/>

  <!-- mark -->
  <g transform="translate(120,196) scale(2.6)">
    <rect x="6" y="6" width="84" height="84" rx="22" fill="#0E1220"/>
    <rect x="6.75" y="6.75" width="82.5" height="82.5" rx="21.25" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/>
    <rect x="16" y="16" width="64" height="64" rx="12" fill="url(#grad)" opacity="0.16"/>
    <g clip-path="url(#lasso)">
      <rect x="12" y="12" width="72" height="72" fill="url(#grad)"/>
      <path d="M42 40 L60 48 L42 56 Z" fill="#FFFFFF" opacity="0.92"/>
    </g>
    <path d="M48 19 L73.11 33.5 L73.11 62.5 L48 77 L22.89 62.5 L22.89 33.5 Z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
    <g fill="#FF7A59" stroke="#0E1220" stroke-width="1.2">
      <circle cx="48" cy="19" r="3.1"/>
      <circle cx="73.11" cy="33.5" r="3.1"/>
      <circle cx="73.11" cy="62.5" r="3.1"/>
      <circle cx="48" cy="77" r="3.1"/>
      <circle cx="22.89" cy="62.5" r="3.1"/>
      <circle cx="22.89" cy="33.5" r="3.1"/>
    </g>
  </g>

  <!-- wordmark + copy -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="430" y="300" font-size="96" font-weight="800" letter-spacing="-3">
      <tspan fill="url(#wordGrad)">KMP</tspan><tspan fill="#EAF0F8">Media</tspan>
    </text>
    <rect x="434" y="322" width="132" height="6" rx="3" fill="url(#bar)"/>
    <text x="434" y="378" font-size="30" font-weight="600" fill="#B9C2D0" letter-spacing="0.2">Media for Kotlin Multiplatform &#43; Compose</text>
    <text x="434" y="420" font-size="26" font-weight="500" fill="#8B95A7">Clip any image or video to any shape &#8212; even a free-form lasso.</text>
    <text x="434" y="454" font-size="24" font-weight="500" fill="#8B95A7">Scrubbable video &#183; depth layering &#183; animated SVG.</text>

    <!-- pills -->
    <g>
      <rect x="434" y="500" width="130" height="50" rx="25" fill="#141A28" stroke="#2A3346" stroke-width="1.5"/>
      <text x="499" y="532" font-size="22" font-weight="600" fill="#C7D0DE" text-anchor="middle">Android</text>

      <rect x="578" y="500" width="86" height="50" rx="25" fill="#141A28" stroke="#2A3346" stroke-width="1.5"/>
      <text x="621" y="532" font-size="22" font-weight="600" fill="#C7D0DE" text-anchor="middle">iOS</text>

      <rect x="678" y="500" width="468" height="50" rx="25" fill="#10192A" stroke="#22456A" stroke-width="1.5"/>
      <circle cx="708" cy="525" r="5" fill="#22D3EE"/>
      <text x="726" y="533" font-size="23" font-weight="500" fill="#DCE6F2" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">se.solidkey:kmpmedia-lib</text>
    </g>
  </g>
</svg>
