#MPP
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g"
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.incremental=true
org.gradle.workers.max=8

org.gradle.configureondemand=true

#Kotlin
kotlin.native.cacheKind=static
kotlin.code.style=official
kotlin.native.cacheKind.iosArm64=static
kotlin.native.cacheKind.iosX64=none
kotlin.native.cinterop.cacheKind=static
compose.kotlin.native.manageCacheKind=false
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvm.options=-Xmx2g
kotlin.incremental=true
kotlin.native.incremental=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true


LIBRARY_VERSION_FALLBACK=1.9.0
GROUP=se.solidkey
POM_ARTIFACT_ID=kmpmedia-lib
POM_NAME=KMP Media Library
POM_DESCRIPTION=Kotlin Multiplatform + Compose media toolkit for Android and iOS: play video and audio (including audio sprites — trigger clips of one sound file for events), render images, animated GIFs, and animated, interactive, runtime-editable SVG, clip any media to built-in or free-form polygon (lasso) shapes, drive playback with live position/duration and seek, and compose depth-layered scenes with z-order and depth-of-field.
